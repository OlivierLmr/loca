# loca model aliases — default set bundled with the binary.
#
# Each entry maps an alias (the model name your clients use) to an MLX
# model on Hugging Face. `ram_gb` is informational (used for the RAM
# meter in the TUI). `description` is shown in the models table.
#
# Aliases with dots must be quoted (TOML treats unquoted dots as nesting).

[models."qwen3.5-9b"]
hf = "mlx-community/Qwen3.5-9B-MLX-4bit"
ram_gb = 6
description = "Qwen 3.5 9B — general, fast; plenty of headroom"

[models."qwen3.5-27b"]
hf = "mlx-community/Qwen3.5-27B-4bit"
ram_gb = 16
description = "Qwen 3.5 27B — general/reasoning; comfortable fit"

[models."qwen3.5-35b-a3b"]
hf = "mlx-community/Qwen3.5-35B-A3B-4bit"
ram_gb = 20
description = "Qwen 3.5 35B-A3B (MoE, 3B active) — high quality, fast for its size"

[models.phi4-14b]
hf = "mlx-community/phi-4-4bit"
ram_gb = 9
description = "Microsoft Phi-4 — strong reasoning at 14B size"

[models.gpt-oss-20b]
hf = "mlx-community/gpt-oss-20b-MXFP4-Q4"
ram_gb = 12
description = "OpenAI gpt-oss 20B — general"

[models.mistral-small-24b]
hf = "mlx-community/Mistral-Small-24B-Instruct-2501-4bit"
ram_gb = 14
description = "Mistral Small 24B — general, multilingual"
