[package]
name = "loca"
version = "0.1.0"
edition = "2021"
authors = ["Olivier Lemer <olivier.lemer@me.com>"]
description = "Wake-on-request local LLM proxy with a live TUI. Runs multiple MLX models and routes OpenAI-compatible requests."
license = "MIT"
repository = "https://github.com/OlivierLmr/loca"
keywords = ["llm", "mlx", "proxy", "tui", "ollama"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "loca"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures = "0.3"
home = "0.5"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
